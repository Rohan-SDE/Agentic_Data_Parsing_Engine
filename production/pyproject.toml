[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-parsing-engine"
version = "1.1.0"
description = "Private data ingestion, bounded agent planning, and evidence-based diagnostics"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.141.1,<0.142", "uvicorn>=0.53.0,<0.54",
  "sqlalchemy>=2.0.54,<2.1", "alembic>=1.20.0,<1.21",
  "psycopg[binary]>=3.3.6,<3.4", "pydantic-settings>=2.15.0,<2.16",
  "httpx>=0.28.1,<0.29", "argon2-cffi>=25.1.0,<26",
  "numpy>=2.3.5,<3", "reportlab>=4.4.9,<5", "filelock>=4.0.1,<5"
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=7.1,<8", "ruff>=0.16.8,<0.17", "pip-audit>=2.10.1,<3"]

[project.scripts]
adpe = "engine.cli:main"

[tool.setuptools.package-data]
engine = ["static/*"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
