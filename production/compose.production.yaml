# Standalone production configuration. Do not merge with the development file.
name: adpe-production
x-app: &app
  build: .
  image: ${ADPE_APP_IMAGE:-adpe:1.1.0}
  init: true
  environment: &environment
    ADPE_ENVIRONMENT: production
    ADPE_DATABASE_URL_FILE: /run/secrets/database_url
    ADPE_DATA_DIR: /data
    ADPE_PUBLIC_ORIGIN: https://${ADPE_DOMAIN:?Configure ADPE_DOMAIN}
    ADPE_ALLOWED_HOSTS: '["${ADPE_DOMAIN}","localhost","127.0.0.1"]'
    ADPE_SECURE_COOKIES: "true"
    ADPE_TRUST_PROXY_HEADERS: "true"
    ADPE_TRUSTED_PROXY_IPS: ${ADPE_PROXY_IP:-172.30.250.2}
    ADPE_PUBLIC_REGISTRATION: ${ADPE_PUBLIC_REGISTRATION:-false}
    ADPE_OLLAMA_ENABLED: ${ADPE_OLLAMA_ENABLED:-false}
    ADPE_OLLAMA_URL: ${ADPE_OLLAMA_URL:-http://host.docker.internal:11434}
    ADPE_OLLAMA_MODEL: ${ADPE_OLLAMA_MODEL:-llama3.2:3b}
    ADPE_WATCHER_USER: ${ADPE_WATCHER_USER:-}
  secrets: [database_url]
  volumes: [analysis_data:/data]
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]
  networks: [private]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: ${ADPE_POSTGRES_IMAGE:-adpe-postgres:17.11}
    build:
      context: .
      dockerfile: deploy/Dockerfile.postgres
    environment:
      POSTGRES_USER: adpe
      POSTGRES_DB: adpe
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, runtime_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-runtime-role.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    networks: [private]
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U adpe -d adpe"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  migrate:
    <<: *app
    command: [python, -m, engine.cli, migrate]
    secrets: [migration_database_url]
    environment:
      <<: *environment
      ADPE_DATABASE_URL_FILE: /run/secrets/migration_database_url
      ADPE_DB_STATEMENT_TIMEOUT_MS: 60000
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    <<: *app
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [python, -m, engine.cli, worker]
    mem_limit: 1536m
    cpus: 2.0
    stop_grace_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, engine.cli, worker-health]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 3
  watcher:
    <<: *app
    profiles: [watcher]
    command: [python, -m, engine.cli, watch]
    mem_limit: 256m
    depends_on:
      migrate: {condition: service_completed_successfully}
  maintenance:
    <<: *app
    command: [python, -m, engine.cli, maintenance]
    mem_limit: 256m
    depends_on:
      migrate: {condition: service_completed_successfully}
  proxy:
    image: ${ADPE_CADDY_IMAGE:-adpe-proxy:1.1.0}
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    environment:
      ADPE_DOMAIN: ${ADPE_DOMAIN:?Configure ADPE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      private:
        ipv4_address: ${ADPE_PROXY_IP:-172.30.250.2}
    mem_limit: 256m
    cpus: 0.5
    depends_on: [api]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  private:
    ipam:
      config:
        - subnet: ${ADPE_PROXY_SUBNET:-172.30.250.0/24}
          ip_range: ${ADPE_PROXY_DYNAMIC_RANGE:-172.30.250.128/25}
secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  database_url:
    file: ./.secrets/database_url
  runtime_password:
    file: ./.secrets/runtime_password
  migration_database_url:
    file: ./.secrets/migration_database_url
volumes:
  postgres_data:
  analysis_data:
  caddy_data:
  caddy_config:
